name: Build and release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BARAFRAME_STORE_PASSWORD: ${{ secrets.BARAFRAME_STORE_PASSWORD }}
      BARAFRAME_KEY_ALIAS: ${{ secrets.BARAFRAME_KEY_ALIAS }}
      BARAFRAME_KEY_PASSWORD: ${{ secrets.BARAFRAME_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BARAFRAME_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing BARAFRAME_KEYSTORE_BASE64 secret'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/baraframe.keystore"
          echo "BARAFRAME_KEYSTORE=$RUNNER_TEMP/baraframe.keystore" >> "$GITHUB_ENV"

      - name: Build four signed APKs
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            :app:assembleRelease -PsplitApks=true \
            -PbuildVersionCode="$((1000 + GITHUB_RUN_NUMBER))"

      - name: Verify APK signatures
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Prepare release notes and checksums
        run: python3 scripts/prepare-release.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BaraFrame-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

      - name: Publish release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          version=$(python3 -c 'import json; print(json.load(open("dist/manifest.json"))["version_name"])')
          latest=false
          if [ "$(gh api "repos/$GH_REPO/commits/master" --jq .sha)" = "$GITHUB_SHA" ]; then
            latest=true
          fi
          gh release create "$tag" dist/*.apk dist/SHA256SUMS dist/SHA512SUMS dist/manifest.json \
            --target "$GITHUB_SHA" \
            --title "BaraFrame $version · Build $GITHUB_RUN_NUMBER" \
            --notes-file dist/RELEASE.md --latest="$latest"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/baraframe.keystore"
